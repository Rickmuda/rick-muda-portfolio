name: 🚀 Deploy naar Etheron

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4.4.0

      - name: 🛠️ Installeer dependencies
        run: npm install

      - name: 🔨 Build project
        run: npm run build

      - name: 📤 Deploy via FTP
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DEST: ${{ secrets.FTP_DEST }}
        timeout-minutes: 20
        run: |
          sudo apt-get install -y lftp
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" \
            -e "set ftp:ssl-allow no; set net:timeout 30; set net:max-retries 3; set net:reconnect-interval-base 5; mirror --reverse --delete --verbose --parallel=4 dist/ $FTP_DEST; bye" \
            web1.ping64.net

      - name: 📧 Notify newsletter subscribers
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          UPDATE_MESSAGE: ${{ github.event.head_commit.message }}
        run: node scripts/send-newsletter.mjs
