name: 🚀 Deploy naar Etheron

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4.4.0

      - name: 🛠️ Installeer dependencies
        run: npm install

      - name: 🔨 Build project
        run: npm run build

      - name: 📤 Deploy via FTP
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DEST: ${{ secrets.FTP_DEST }}
        run: |
          sudo apt-get install -y lftp
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" \
            -e "set ftp:ssl-allow no; mirror --reverse --delete dist/ $FTP_DEST; bye" \
            web1.ping64.net
